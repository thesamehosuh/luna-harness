name: Luna release checks
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: luna-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.13.5"
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - name: Install runtime and test dependencies
        run: |
          uv sync --python 3.11 --frozen --extra luna --no-dev
          uv pip install --python .venv/bin/python -e luna/lib pytest==9.1.1 pytest-asyncio==1.3.0 aiohttp==3.14.4 slack-bolt==1.30.0 slack-sdk==3.44.1
          npm ci --workspace web --workspace ui-tui --include-workspace-root
      - name: Dependency lock
        run: uv lock --check
      - name: Companion and gateway regressions
        env:
          HERMES_PY: ${{ github.workspace }}/.venv/bin/python
        run: scripts/test.sh
      - name: Dashboard API contracts
        run: >-
          .venv/bin/python -m pytest -q
          tests/hermes_cli/test_web_luna_routes.py
          tests/hermes_cli/test_luna_web_server_copy.py
          tests/hermes_cli/test_web_server.py
          tests/hermes_cli/test_update_contract.py
      - name: Dashboard tests
        run: npm test --workspace web
      - name: Bundled companion chat runtime
        run: |
          npm run build --workspace ui-tui
          mkdir -p hermes_cli/tui_dist
          cp ui-tui/dist/entry.js hermes_cli/tui_dist/entry.js
          printf '{"type":"module"}\n' > hermes_cli/tui_dist/package.json
          .venv/bin/python scripts/verify_dashboard_chat.py
      - name: Managed memory data path and recovery (local model fixtures)
        run: .venv/bin/python scripts/verify_luna_memory.py --output /tmp/luna-memory-integration.json
      - name: Native OpenCode tool round trip (local model fixture)
        run: .venv/bin/python scripts/verify_opencode_native.py --install
      - name: Native OpenCode context and resume (local model fixture)
        run: .venv/bin/python scripts/verify_opencode_context.py --install
      - name: Build and install release outside the checkout
        env:
          PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: scripts/test-release.sh

  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python }}
      - name: Install supported runtime
        run: |
          uv sync --python "${{ matrix.python }}" --frozen --extra luna --no-dev
          uv pip install --python .venv/bin/python -e luna/lib pytest==9.1.1 pytest-asyncio==1.3.0
      - name: Settings, delivery, upgrade and migration failure cases
        run: .venv/bin/python -m pytest -q luna/tests/component/test_audit_regressions.py luna/tests/unit/test_deploy.py luna/tests/unit/test_opencode.py
      - name: Real native protocol and context checks
        run: |
          .venv/bin/python scripts/verify_opencode_native.py --install
          .venv/bin/python scripts/verify_opencode_context.py --install
