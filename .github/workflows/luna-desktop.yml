name: Luna desktop release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this tested version as a public alpha release after all jobs pass
        required: false
        type: boolean
        default: false
      download_base:
        description: Optional HTTPS release-assets directory; defaults to this repo's versioned GitHub release
        required: false
        type: string
  pull_request:
    paths:
      - apps/bootstrap-installer/**
      - luna/deploy/**
      - luna/lib/**
      - scripts/verify_desktop_release.py
      - scripts/verify_desktop_launcher.py
      - web/**
      - ui-tui/**
      - apps/shared/**
      - luna/assets/**
      - luna/config/**
      - hermes_cli/**
      - plugins/memory/honcho/**
      - luna-release.json
      - pyproject.toml
      - uv.lock
      - .github/workflows/luna-desktop.yml
permissions:
  contents: read
jobs:
  release-checks:
    uses: ./.github/workflows/luna.yml

  runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - name: Build precompiled runtime and pinned launcher descriptor
        shell: bash
        env:
          REQUESTED_DOWNLOAD_BASE: ${{ inputs.download_base }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("luna-release.json"))["version"])')
          release_base=${REQUESTED_DOWNLOAD_BASE:-$REPOSITORY_URL/releases/download/v$version}
          python3 luna/deploy/build-release.py "$RUNNER_TEMP/luna-runtime" --download-base "$release_base"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: luna-runtime
          path: ${{ runner.temp }}/luna-runtime/*
          compression-level: 0
          if-no-files-found: error

  native:
    needs: runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            name: linux-x64
            bundles: appimage,deb,rpm
          - runner: ubuntu-22.04-arm
            name: linux-arm64
            bundles: appimage,deb,rpm
          - runner: macos-14
            name: macos-arm64
            bundles: app,dmg
          - runner: macos-15-intel
            name: macos-x64
            bundles: app,dmg
          - runner: windows-2022
            name: windows-x64-preview
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      HERMES_HOME: ${{ runner.temp }}/luna-native-test-home
      LUNA_HOME: ${{ runner.temp }}/luna-native-test-home
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: luna-runtime
          path: artifacts
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.13.5'
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - name: Native Linux webview build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf webkit2gtk-driver xvfb xauth xdotool dbus-x11
      - name: Install source test tools and launcher frontend
        shell: bash
        run: |
          uv sync --python 3.11 --frozen --extra luna --no-dev
          test_python=$(uv run --no-sync --python 3.11 python -c 'import sys; print(sys.executable)')
          uv pip install --python "$test_python" pytest==9.1.1 pytest-asyncio==1.3.0 -e luna/lib
          npm ci --workspace apps/bootstrap-installer --include-workspace-root
          npm run build --workspace apps/bootstrap-installer
          rustup toolchain install stable --profile minimal
      - name: Native locks, process handling and actual ConPTY contracts
        shell: bash
        run: >-
          uv run --no-sync --python 3.11 -m pytest -q
          luna/tests/component/test_beginner_setup.py
          tests/hermes_cli/test_win_pty_bridge.py
          tests/gateway/test_control_socket.py
          tests/test_windows_subprocess_no_window_flags.py
      - name: Install the actual archive outside the checkout and verify offline memory/dashboard
        shell: bash
        run: python scripts/verify_desktop_release.py artifacts/luna-*.tar.gz --workspace "$RUNNER_TEMP/luna-desktop-smoke"
      - name: Rust process/console tests
        shell: bash
        run: cargo +stable test --locked --manifest-path apps/bootstrap-installer/src-tauri/Cargo.toml --lib
      - name: Extract the exact runtime through the launcher
        shell: bash
        run: |
          export LUNA_TEST_ARCHIVE=$(python -c 'import glob,pathlib; print(pathlib.Path(glob.glob("artifacts/luna-*.tar.gz")[0]).resolve())')
          cargo +stable test --locked --manifest-path apps/bootstrap-installer/src-tauri/Cargo.toml --lib -- --ignored
      - name: Native Linux startup, tray, permission and close/quit acceptance
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo install tauri-driver --version 2.1.0 --locked
          npm run tauri:build:debug --workspace apps/bootstrap-installer -- --no-bundle
          dbus-run-session -- xvfb-run -a python scripts/verify_desktop_launcher.py \
            --application apps/bootstrap-installer/src-tauri/target/debug/Luna \
            --runtime-home "$RUNNER_TEMP/luna-desktop-smoke/Clean Luna home" \
            --output "$RUNNER_TEMP/luna-launcher-acceptance.json"
      - name: Build candidate native installer
        shell: bash
        env:
          NATIVE_BUNDLES: ${{ matrix.bundles }}
        run: |
          export LUNA_RELEASE_DESCRIPTOR=$(python -c 'from pathlib import Path; print(Path("artifacts/luna-launcher-release.json").resolve())')
          npm run tauri:build --workspace apps/bootstrap-installer -- --bundles "$NATIVE_BUNDLES"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: luna-${{ matrix.name }}-candidate
          path: |
            apps/bootstrap-installer/src-tauri/target/release/bundle/**
            ${{ runner.temp }}/luna-launcher-acceptance.json
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [release-checks, runtime, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: artifacts
      - name: Collect exact tested installers and runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil
          output = Path('release-assets')
          output.mkdir()
          for path in Path('artifacts').rglob('*'):
              if not path.is_file():
                  continue
              if (path.name.endswith(('.AppImage', '.deb', '.rpm', '.dmg', '-setup.exe'))
                  or path.name == 'luna-launcher-release.json'
                  or path.name.startswith('luna-') and path.name.endswith('.tar.gz')):
                  target = output / path.name
                  if target.exists():
                      raise RuntimeError(f'Duplicate artifact name: {path.name}')
                  shutil.copy2(path, target)
          descriptor = json.loads((output / 'luna-launcher-release.json').read_text())
          archive = output / descriptor['runtime']['url'].rsplit('/', 1)[-1]
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == descriptor['runtime']['sha256']
          assert any(output.glob('*.AppImage')) and any(output.glob('*.dmg')) and any(output.glob('*-setup.exe'))
          entries = [f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}' for p in sorted(output.iterdir())]
          (output / 'SHA256SUMS').write_text('\n'.join(entries) + '\n')
          PY
      - name: Attest the published files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Publish alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("luna-release.json"))["version"])')
          gh release create "v$version" release-assets/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Luna $version" --prerelease --draft --notes-file RELEASE_NOTES.md
          gh release edit "v$version" --repo "$GITHUB_REPOSITORY" --draft=false
