name: Bug report
description: Something in Luna does not work as expected.
body:
  - type: markdown
    attributes:
      value: "Please use synthetic examples. Never paste keys, tokens, transport IDs or personal chat history."
  - type: input
    id: version
    attributes:
      label: Luna version and operating system
      placeholder: "0.1.0-alpha.1, Linux x64"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened, and what did you expect?
      description: Include the dashboard or launcher step and a reproducible example when possible.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted details
      description: Optional screenshots or logs with credentials and personal information removed.
